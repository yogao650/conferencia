<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div id="app" class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 bg-indigo-700 p-4 rounded-2xl text-white shadow-lg">
            <h1 class="font-black text-xl">CONFERÊNCIA PRO</h1>
            <span id="cloud-status" class="text-[10px] bg-indigo-800 px-2 py-1 rounded-full">SINCRO ONLINE</span>
        </header>

        <div id="home">
            <div class="bg-white p-8 rounded-3xl shadow-md border-2 border-dashed border-indigo-100 text-center">
                <input type="file" id="xml-file" accept=".xml" class="hidden">
                <button onclick="document.getElementById('xml-file').click()" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black hover:bg-indigo-700 transition-all">
                    IMPORTAR XML DA NOTA
                </button>
                <p class="text-slate-400 mt-4 text-sm">Selecione o arquivo da nota fiscal para começar</p>
            </div>
            <div id="list" class="mt-8 space-y-4">
                <p class="text-center text-slate-400">Buscando notas no banco de dados...</p>
            </div>
        </div>

        <div id="scanner" class="hidden">
            <button onclick="location.reload()" class="mb-4 text-indigo-600 font-bold">← Voltar</button>
            <div class="bg-white p-6 rounded-3xl shadow-xl mb-6">
                <h2 id="note-title" class="font-black text-lg mb-4">Nota</h2>
                <div class="flex gap-2">
                    <input type="text" id="barcode" placeholder="Bipe o produto" class="flex-1 p-4 border-2 rounded-xl outline-none focus:border-indigo-600">
                    <input type="number" id="qty" value="1" class="w-20 p-4 border-2 rounded-xl text-center font-bold">
                    <button onclick="confirmItem()" class="bg-indigo-600 text-white px-6 rounded-xl font-bold">OK</button>
                </div>
            </div>
            <div id="items" class="bg-white rounded-2xl shadow-md overflow-hidden divide-y"></div>
        </div>
    </div>

    <script type="module">

        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // CONFIGURAÇÃO AUTOMÁTICA (Usando a chave padrão do seu projeto se existir, ou uma temporária)
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {
            apiKey: "AIzaSyAs-Exemplo-123", // O Firebase gera isso
            authDomain: "conferencia-ean.firebaseapp.com",
            projectId: "conferencia-ean",
            storageBucket: "conferencia-ean.appspot.com",
            messagingSenderId: "123",
            appId: "1:123:web:123"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const path = "conferencia-v1";

        let currentNote = null;
        let noteId = null;

        // Login
        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, 'artifacts', path, 'public', 'data', 'notes'), (snap) => {
                const listDiv = document.getElementById('list');
                listDiv.innerHTML = snap.empty ? '<p class="text-center text-slate-300">Nenhuma nota encontrada.</p>' : '';
